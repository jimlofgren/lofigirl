<html lang="en">
<head>

<link rel="apple-touch-icon" href="favicon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  --bg:#1a110d;
  --ink:#f7ecdc;
  --muted:#b8a48c;
  --accent:#f2b36a;
  --glass:rgba(22,13,9,.55);
  --line:rgba(255,235,210,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;overflow:hidden}
#scene{position:fixed;inset:0;background:#1a110d}
#scene svg{width:100%;height:100%;transform-origin:48% 55%;animation:cam 50s ease-in-out infinite alternate}
@keyframes cam{0%{transform:scale(1.02) translate(0,0)}100%{transform:scale(1.07) translate(.8%,-.6%)}}

.player{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:3;width:min(720px,calc(100% - 32px));background:var(--glass);border:1px solid var(--line);border-radius:18px;backdrop-filter:blur(14px);box-shadow:0 20px 60px rgba(0,0,0,.45);padding:12px 18px 12px 12px;display:grid;grid-template-columns:auto auto 1fr auto;gap:14px;align-items:center}

.turntable{position:relative;width:76px;height:76px;flex:none}
.disc{position:absolute;inset:0;border-radius:50%;background:
  radial-gradient(circle at 50% 50%,transparent 0 20px,#111 20px 21.5px,transparent 21.5px),
  repeating-radial-gradient(circle at 50% 50%,#1a1a1f 0 1.2px,#0b0b0e 1.2px 3px),
  #0e0e12;
  box-shadow:0 8px 20px rgba(0,0,0,.6),inset 0 0 0 1px rgba(255,255,255,.06);
  animation:spin 1.8s linear infinite;animation-play-state:paused}
.disc::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 40deg,rgba(255,255,255,.07) 55deg,transparent 70deg,transparent 220deg,rgba(255,255,255,.05) 235deg,transparent 250deg)}
.playing .disc{animation-play-state:running}
@keyframes spin{to{transform:rotate(360deg)}}
.label{position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;overflow:hidden;background:linear-gradient(135deg,#f2b36a,#b85c5c)}
.label img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .5s}
.label img.ok{opacity:1}
.label::after{content:"";position:absolute;left:50%;top:50%;width:5px;height:5px;margin:-2.5px 0 0 -2.5px;border-radius:50%;background:#0b0b0e;box-shadow:0 0 0 1.5px rgba(255,255,255,.25)}

.btn{width:46px;height:46px;border-radius:50%;border:0;background:var(--accent);color:#2a1407;display:grid;place-items:center;cursor:pointer;transition:transform .15s;flex:none}
.btn:hover{transform:scale(1.06)}
.btn:active{transform:scale(.96)}
.btn svg{width:20px;height:20px;fill:currentColor}
.btn .ic-pause{display:none}
.playing .btn .ic-play{display:none}
.playing .btn .ic-pause{display:block}

.meta{min-width:0;display:flex;flex-direction:column;gap:6px}
.now{display:flex;flex-direction:column;gap:1px;min-width:0}
.now b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.25}
.now span{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stations{display:flex;gap:2px 12px;flex-wrap:wrap}
.chip{font-family:"DM Mono",monospace;font-size:10.5px;letter-spacing:.3px;padding:2px 0;border:0;background:none;color:var(--muted);opacity:.7;cursor:pointer;transition:all .15s;border-bottom:1px solid transparent}
.chip:hover{opacity:1;color:var(--ink)}
.chip.active{opacity:1;color:var(--accent);border-bottom-color:var(--accent)}

.vol{display:flex;align-items:center;gap:8px;color:var(--muted)}
.vol svg{width:16px;height:16px;fill:currentColor}
input[type=range]{-webkit-appearance:none;width:80px;height:3px;background:rgba(255,235,210,.2);border-radius:2px;outline:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--ink);cursor:pointer}

.gate{position:fixed;inset:0;z-index:5;display:grid;place-items:center;background:rgba(10,6,4,.5);backdrop-filter:blur(5px);cursor:pointer;transition:opacity .5s}
.gate.hidden{opacity:0;pointer-events:none}
.gate .big{width:84px;height:84px;border-radius:50%;background:var(--accent);display:grid;place-items:center;box-shadow:0 10px 40px rgba(242,179,106,.4);animation:breathe 2.4s ease-in-out infinite}
.gate .big svg{width:34px;height:34px;fill:#2a1407;margin-left:4px}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}

.bgmedia{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;display:none}
body.hasbg .bgmedia.on{display:block}
body.hasbg #scene svg{display:none}

#yt{position:fixed;left:0;right:0;top:0;bottom:150px;z-index:3;display:none;place-items:center;padding:16px}
#yt.show{display:grid}
#yt iframe{width:min(100%,calc((100vh - 182px) * 16 / 9));aspect-ratio:16/9;height:auto;border:0;display:block;border-radius:10px;box-shadow:0 24px 60px rgba(0,0,0,.6);background:#000}
body.ytmode #scene{filter:brightness(.3) saturate(.7)}

.headsway{transform-origin:610px 400px;animation:sway 7s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-.8deg)}50%{transform:rotate(1deg)}}
.head{transform-origin:610px 400px;animation:nod 1.5s ease-in-out infinite}
@keyframes nod{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(3px) rotate(.6deg)}}
.bun{transform-origin:520px 285px;animation:bun 1.5s ease-in-out infinite;animation-delay:.12s}
@keyframes bun{0%,100%{transform:rotate(0)}50%{transform:rotate(-3deg) translateY(1px)}}
.eye{animation:blink 5.2s ease-in-out infinite}
@keyframes blink{0%,91%,100%{transform:scaleY(1)}94%{transform:scaleY(.06)}97%{transform:scaleY(1)}}
.torso{transform-origin:600px 620px;animation:breath 4.2s ease-in-out infinite}
@keyframes breath{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.012)}}
.hand{transform-origin:760px 592px;animation:write 1.9s ease-in-out infinite}
@keyframes write{0%{transform:translate(0,0) rotate(0)}18%{transform:translate(6px,1px) rotate(1.5deg)}36%{transform:translate(11px,0) rotate(2deg)}50%{transform:translate(15px,2px) rotate(1deg)}62%{transform:translate(9px,0) rotate(-.5deg)}78%{transform:translate(3px,1px) rotate(1deg)}100%{transform:translate(0,0) rotate(0)}}
.catbody{transform-origin:1270px 560px;animation:catbreath 3.6s ease-in-out infinite}
@keyframes catbreath{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.03)}}
.tail{transform-origin:1306px 548px;animation:tail 3.4s ease-in-out infinite}
@keyframes tail{0%,100%{transform:rotate(0)}50%{transform:rotate(14deg)}}
.ear{transform-origin:1252px 450px;animation:ear 6s ease-in-out infinite}
@keyframes ear{0%,85%,100%{transform:rotate(0)}90%{transform:rotate(-14deg)}95%{transform:rotate(8deg)}}
.cathead{transform-origin:1270px 480px;animation:cathead 11s ease-in-out infinite}
@keyframes cathead{0%,40%,100%{transform:rotate(0)}48%,70%{transform:rotate(-6deg)}78%{transform:rotate(2deg)}}
.steam path{animation:steam 3.4s ease-in-out infinite;opacity:0}
.steam path:nth-child(2){animation-delay:-1.1s}
.steam path:nth-child(3){animation-delay:-2.2s}
@keyframes steam{0%{transform:translateY(0) scaleX(1);opacity:0}25%{opacity:.5}100%{transform:translateY(-40px) scaleX(1.3);opacity:0}}
.twinkle{animation:tw 3s ease-in-out infinite}
.twinkle:nth-child(3n){animation-delay:-1s}
.twinkle:nth-child(3n+1){animation-delay:-2s}
.twinkle:nth-child(5n){animation-duration:4.4s}
@keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}
.winlight{animation:win 7s steps(1) infinite}
.winlight:nth-child(2n){animation-delay:-2.5s;animation-duration:9s}
.winlight:nth-child(3n){animation-delay:-5s;animation-duration:11s}
.winlight:nth-child(7n){animation-delay:-1s;animation-duration:5s}
@keyframes win{0%,88%{opacity:.9}89%,96%{opacity:.15}97%,100%{opacity:.9}}
.beacon{animation:beacon 1.6s steps(1) infinite}
@keyframes beacon{0%,45%{opacity:1}50%,100%{opacity:.08}}
.cloud{animation:cloud 120s linear infinite}
.cloud.b{animation-duration:170s;animation-delay:-80s}
@keyframes cloud{0%{transform:translateX(-340px)}100%{transform:translateX(760px)}}
.plane{animation:plane 40s linear infinite}
@keyframes plane{0%,55%{transform:translate(-40px,0);opacity:0}56%{opacity:1}99%{opacity:1}100%{transform:translate(680px,-50px);opacity:0}}
.plane circle:nth-child(2){animation:beacon 1s steps(1) infinite}
.boat{animation:boat 90s linear infinite}
@keyframes boat{0%{transform:translateX(0)}100%{transform:translateX(560px)}}
.reflect{animation:reflect 2.6s ease-in-out infinite}
.reflect:nth-child(2n){animation-delay:-1s}
.reflect:nth-child(3n){animation-delay:-1.8s;animation-duration:3.3s}
@keyframes reflect{0%,100%{opacity:.35;transform:scaleY(1)}50%{opacity:.7;transform:scaleY(1.25)}}
.lampglow{animation:flicker 5s ease-in-out infinite}
@keyframes flicker{0%,100%{opacity:1}42%{opacity:.94}44%{opacity:1}73%{opacity:.97}}
.plant{transform-origin:1520px 600px;animation:psway 5.5s ease-in-out infinite}
@keyframes psway{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg)}}
.mote{animation:mote 9s ease-in-out infinite;opacity:0}
.mote:nth-child(2n){animation-duration:12s;animation-delay:-4s}
.mote:nth-child(3n){animation-duration:10s;animation-delay:-7s}
.mote:nth-child(4n){animation-delay:-2s}
.mote:nth-child(5n){animation-duration:14s;animation-delay:-9s}
@keyframes mote{0%{transform:translate(0,0);opacity:0}15%{opacity:.7}50%{transform:translate(8px,-28px);opacity:.5}85%{opacity:.6}100%{transform:translate(-6px,-60px);opacity:0}}
.paused .head,.paused .hand,.paused .bun{animation-play-state:paused}

@media (max-width:720px){
  .player{grid-template-columns:auto auto 1fr;padding:10px}
  .vol{display:none}
  #yt{bottom:170px;padding:10px}
  #yt iframe{width:min(100%,calc((100vh - 200px) * 16 / 9))}
}
@media (prefers-reduced-motion:reduce){
  #scene svg,.headsway,.head,.bun,.eye,.torso,.hand,.catbody,.tail,.ear,.cathead,.steam path,.twinkle,.winlight,.beacon,.cloud,.plane,.boat,.reflect,.lampglow,.plant,.mote{animation:none}
}
</style>

<div id="yt"></div>

<div class="player" id="player">
  <div class="turntable">
    <div class="disc"><div class="label"><img id="art" alt=""></div></div>
  </div>
  <button class="btn" id="toggle" aria-label="Play or pause">
    <svg class="ic-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    <svg class="ic-pause" viewBox="0 0 24 24"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
  </button>
  <div class="meta">
    <div class="now"><b id="tTitle">—</b><span id="tArtist"></span></div>
    <div class="stations" id="stations"></div>
  </div>
  <div class="vol">
    <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4z"/></svg>
    <input type="range" id="vol" min="0" max="1" step=".01" value=".8" aria-label="Volume">
  </div>
</div>

<div class="gate" id="gate">
  <div class="big"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
</div>

<audio id="audio" preload="none"></audio>

<script>
const stations=[
  {id:"chillhop",name:"FluxFM Chillhop",url:"https://channels.fluxfm.de/chillhop/externalembedflxhp/stream.mp3",fallback:"https://channels.fluxfm.de/chillhop/externalembedflxhp/stream.aac",meta:"fluxfm"},
  {id:"chillsynth",name:"Nightride Chillsynth",url:"https://stream.nightride.fm/chillsynth.mp3",meta:"nightride"},
  {id:"plaza",name:"Nightwave Plaza",url:"https://radio.plaza.one/mp3",meta:"plaza"},
  {id:"yt",name:"Lofi Girl on YouTube",yt:"jfKfPfyJRdk",meta:"yt"}
];

const audio=document.getElementById("audio");
const player=document.getElementById("player");
const scene=document.getElementById("scene");
const tTitle=document.getElementById("tTitle");
const tArtist=document.getElementById("tArtist");
const art=document.getElementById("art");
const stationsEl=document.getElementById("stations");
const gate=document.getElementById("gate");
const yt=document.getElementById("yt");
const vol=document.getElementById("vol");

let current=stations.findIndex(s=>s.id===(localStorage.getItem("lofi.station")||"chillhop"));
if(current<0)current=0;
let wantPlaying=false;
let retries=0;
let usingFallback=false;
let retryTimer=null;
let ytPlayer=null;
let ytReady=false;

audio.volume=parseFloat(localStorage.getItem("lofi.vol")||"0.8");
vol.value=audio.volume;

function setPlayingUI(on){
  player.classList.toggle("playing",on);
  scene.classList.toggle("paused",!on);
  if("mediaSession" in navigator)navigator.mediaSession.playbackState=on?"playing":"paused";
}

function renderStations(){
  stationsEl.innerHTML="";
  stations.forEach((s,i)=>{
    const b=document.createElement("button");
    b.className="chip"+(i===current?" active":"");
    b.textContent=s.name;
    b.onclick=()=>{tune(i);if(!wantPlaying)play()};
    stationsEl.appendChild(b);
  });
}

const track={key:"",timer:null,es:null};

function stopMeta(){
  clearTimeout(track.timer);
  if(track.es){track.es.close();track.es=null}
}

function setArt(url){
  art.classList.remove("ok");
  art.dataset.want=url||"";
  if(!url){art.removeAttribute("src");return}
  const img=new Image();
  img.onload=()=>{if(art.dataset.want===url){art.src=url;art.classList.add("ok")}};
  img.src=url;
}

async function lookupArt(artist,title){
  const term=encodeURIComponent((artist+" "+title).replace(/[\(\[].*?[\)\]]/g,"").trim());
  const r=await fetch("https://itunes.apple.com/search?term="+term+"&entity=song&limit=1");
  const j=await r.json();
  const hit=j.results&&j.results[0];
  return hit?hit.artworkUrl100.replace("100x100","600x600"):null;
}

function showTrack(title,artist,artUrl){
  const key=title+"|"+artist;
  if(key===track.key)return;
  track.key=key;
  tTitle.textContent=title||"—";
  tArtist.textContent=artist||"";
  document.title=title&&artist?title+" · "+artist:"lofi girl";
  setArt(artUrl);
  if(!artUrl&&title&&artist){
    lookupArt(artist,title).then(u=>{if(track.key===key)setArt(u)}).catch(()=>{});
  }
  if("mediaSession" in navigator){
    navigator.mediaSession.metadata=new MediaMetadata({title:title||stations[current].name,artist:artist||"",album:stations[current].name,artwork:artUrl?[{src:artUrl,sizes:"600x600",type:"image/jpeg"}]:[]});
  }
}

function startMeta(){
  stopMeta();
  const s=stations[current];
  track.key="";
  showTrack(s.name,"",null);
  if(s.meta==="yt"){showTrack("lofi hip hop radio","Lofi Girl","https://i.ytimg.com/vi/"+s.yt+"/hqdefault.jpg");return}
  if(s.meta==="nightride"){
    track.es=new EventSource("https://nightride.fm/meta");
    track.es.onmessage=e=>{
      try{
        const list=JSON.parse(e.data);
        const t=list.filter(x=>x.station==="chillsynth").pop();
        if(t)showTrack(t.title,t.artist,null);
      }catch(err){}
    };
    return;
  }
  const poll=async()=>{
    try{
      if(s.meta==="fluxfm"){
        const j=await (await fetch("https://fluxmusic.api.radiosphere.io/channels/chillhop/current-track",{cache:"no-store"})).json();
        const t=j.trackInfo||{};
        showTrack(t.title,t.artistCredits,t.artwork||(t.release&&t.release.artwork&&t.release.artwork.url)||null);
      }else if(s.meta==="plaza"){
        const j=await (await fetch("https://api.plaza.one/status",{cache:"no-store"})).json();
        showTrack(j.song.title,j.song.artist,j.song.artwork_src||null);
      }
    }catch(err){}
    track.timer=setTimeout(poll,15000);
  };
  poll();
}

function streamUrl(s){
  const base=usingFallback&&s.fallback?s.fallback:s.url;
  return base+(base.includes("?")?"&":"?")+"t="+Date.now();
}

function stopYT(){
  if(ytPlayer&&ytReady){try{ytPlayer.pauseVideo()}catch(e){}}
  yt.classList.remove("show");
  document.body.classList.remove("ytmode");
}

function loadYT(){
  yt.classList.add("show");
  document.body.classList.add("ytmode");
  if(ytPlayer){
    if(ytReady){ytPlayer.setVolume(Math.round(audio.volume*100));ytPlayer.playVideo()}
    return;
  }
  const el=document.createElement("div");
  el.id="ytframe";
  yt.appendChild(el);
  const make=()=>{
    ytPlayer=new YT.Player("ytframe",{
      width:"100%",height:"100%",
      videoId:stations[current].yt,
      playerVars:{autoplay:1,controls:1,rel:0,playsinline:1},
      events:{
        onReady:e=>{ytReady=true;e.target.setVolume(Math.round(audio.volume*100));e.target.playVideo()},
        onStateChange:e=>{
          if(stations[current].yt)setPlayingUI(e.data===YT.PlayerState.PLAYING||e.data===YT.PlayerState.BUFFERING);
        },
        onError:()=>next()
      }
    });
  };
  if(window.YT&&window.YT.Player)make();
  else{
    window.onYouTubeIframeAPIReady=make;
    const s=document.createElement("script");
    s.src="https://www.youtube.com/iframe_api";
    document.head.appendChild(s);
  }
}

function tune(i){
  clearTimeout(retryTimer);
  current=(i+stations.length)%stations.length;
  retries=0;usingFallback=false;
  localStorage.setItem("lofi.station",stations[current].id);
  renderStations();
  startMeta();
  const s=stations[current];
  if(s.yt){
    audio.pause();audio.removeAttribute("src");audio.load();
    if(wantPlaying)loadYT();
  }else{
    stopYT();
    audio.src=streamUrl(s);
    if(wantPlaying)audio.play().catch(()=>{});
  }
}

function play(){
  wantPlaying=true;
  gate.classList.add("hidden");
  const s=stations[current];
  if(s.yt){loadYT();return}
  if(!audio.src)audio.src=streamUrl(s);
  audio.play().catch(err=>{
    if(err&&err.name==="NotAllowedError")gate.classList.remove("hidden");
    else scheduleRetry();
  });
}

function pause(){
  wantPlaying=false;
  clearTimeout(retryTimer);
  const s=stations[current];
  if(s.yt&&ytPlayer&&ytReady)ytPlayer.pauseVideo();
  else{audio.pause();audio.removeAttribute("src");audio.load()}
  setPlayingUI(false);
}

function next(){tune(current+1);if(wantPlaying)play()}
function prev(){tune(current-1);if(wantPlaying)play()}

function scheduleRetry(){
  if(!wantPlaying)return;
  clearTimeout(retryTimer);
  retries++;
  const s=stations[current];
  if(retries===3&&s.fallback&&!usingFallback){usingFallback=true;retries=0}
  if(retries>4){retries=0;setTimeout(next,800);return}
  const wait=Math.min(8000,800*Math.pow(2,retries));
  setPlayingUI(false);
  retryTimer=setTimeout(()=>{audio.src=streamUrl(s);audio.play().catch(()=>scheduleRetry())},wait);
}

audio.addEventListener("playing",()=>{retries=0;setPlayingUI(true)});
audio.addEventListener("stalled",()=>{if(wantPlaying)scheduleRetry()});
audio.addEventListener("error",()=>{if(wantPlaying)scheduleRetry()});
audio.addEventListener("ended",()=>{if(wantPlaying)scheduleRetry()});
audio.addEventListener("pause",()=>{if(wantPlaying&&!audio.error&&audio.networkState!==3)scheduleRetry()});

document.getElementById("toggle").onclick=()=>wantPlaying?pause():play();
gate.onclick=play;
vol.oninput=()=>{
  audio.volume=parseFloat(vol.value);
  localStorage.setItem("lofi.vol",vol.value);
  if(ytPlayer&&ytReady)ytPlayer.setVolume(Math.round(audio.volume*100));
};

document.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT")return;
  if(e.code==="Space"){e.preventDefault();wantPlaying?pause():play()}
  if(e.key==="ArrowRight")next();
  if(e.key==="ArrowLeft")prev();
  if(e.key==="ArrowUp"){vol.value=Math.min(1,parseFloat(vol.value)+.05);vol.oninput()}
  if(e.key==="ArrowDown"){vol.value=Math.max(0,parseFloat(vol.value)-.05);vol.oninput()}
});

window.addEventListener("online",()=>{if(wantPlaying)play()});
document.addEventListener("visibilitychange",()=>{
  if(!document.hidden&&wantPlaying&&!stations[current].yt&&audio.paused)play();
});

if("mediaSession" in navigator){
  navigator.mediaSession.setActionHandler("play",play);
  navigator.mediaSession.setActionHandler("pause",pause);
  navigator.mediaSession.setActionHandler("nexttrack",next);
  navigator.mediaSession.setActionHandler("previoustrack",prev);
}

async function loadBackground(){
  const exists=async f=>{try{return (await fetch(f,{method:"HEAD"})).ok}catch(e){return false}};
  for(const f of ["bg.mp4","bg.webm","bg.mov"]){
    if(await exists(f)){
      const v=document.getElementById("bgv");
      v.src=f;v.classList.add("on");document.body.classList.add("hasbg");
      v.play().catch(()=>{});
      return;
    }
  }
  for(const f of ["bg.jpg","bg.jpeg","bg.png","bg.webp","bg.gif"]){
    if(await exists(f)){
      const i=document.getElementById("bgi");
      i.src=f;i.classList.add("on");document.body.classList.add("hasbg");
      return;
    }
  }
}
loadBackground();

renderStations();
startMeta();
setPlayingUI(false);
if(!stations[current].yt){
  audio.src=streamUrl(stations[current]);
  audio.play().then(()=>{wantPlaying=true;gate.classList.add("hidden")}).catch(()=>{});
}
</script>
